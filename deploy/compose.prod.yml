# henley-website — production (thehenley.com.au)
#
# NOT the cutover procedure. Read docs/runbook-cutover.md first; bringing this
# up is one step of it, and the steps around it — the rollback material, the
# NPM change that keeps /webhooks, stopping WordPress — are the ones that
# matter.
#
#   cd /mnt/persistent/dev/henley-website
#   npm run tokens
#   docker compose -f deploy/compose.prod.yml up -d --build
#
# `npm run tokens` first, always: the site image builds from this repo without
# the brand kit mounted, so tokens.css has to already be in the build context.
# The Dockerfile fails with that message rather than building a site with no
# colours in it.
#
# The network is created once, by hand, and attached to Nginx Proxy Manager:
#
#   docker network create henley-website-prod-net
#   # add it to /home/admin/henley-aws/docker-compose.yml under the
#   # npm-attachment service and the networks: block, then recreate NPM
#
# At cutover, hosts 5 (thehenley.com.au) and 11 (www) move to
# henley-website-prod:8080, each keeping TWO extra locations:
#
#   /webhooks    -> henley-webhooks:8000     ALREADY THERE. Systems beyond this
#                                            website depend on it. Losing it is
#                                            the single worst thing this cutover
#                                            can do, and it is silent.
#   /api/enquiry -> henley-website-forms-prod:8000

name: henley-website-prod

services:
  site:
    container_name: henley-website-prod
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: henley-website:prod
    restart: unless-stopped
    networks:
      - henley-website-prod-net
    # No published port: NPM reaches it over the shared network. Nothing on
    # this host should be able to reach it directly.
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/nginx-health']
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  forms:
    container_name: henley-website-forms-prod
    build:
      context: ../forms
      dockerfile: Dockerfile
    image: henley-website-forms:prod
    restart: unless-stopped
    # The host's `admin` user, so the SQLite file and its -wal/-shm sidecars are
    # readable by the henley-utils job that runs as that user.
    user: '1000:1000'
    environment:
      INTAKE_DB_PATH: /data/intake.sqlite
      # X-Forwarded-For is believed only from NPM, and only by the receiver —
      # uvicorn runs with --no-proxy-headers so nothing else gets a vote.
      # Anyone can send the header, and trusting it generally would make every
      # rate limit bypassable by inventing an address per request.
      #
      # This is the npm-attachment container's address ON THIS NETWORK. Read it
      # after the first `up`, and again after every NPM recreation — adding any
      # network to npm-attachment reassigns them:
      #   docker inspect -f '{{range $$n, $$c := .NetworkSettings.Networks}}{{$$n}} {{$$c.IPAddress}}{{"\n"}}{{end}}' npm-attachment
      #
      # Empty is not a default, it is a misconfiguration: every visitor is then
      # attributed to the proxy and three-an-hour becomes a site-wide limit.
      # The receiver logs a warning at startup when this is unset —
      # `docker logs <container> | head` is the check. Verified with
      # scripts/check-proxy-trust.sh.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      CONTACT_PHONE: '07 5591 2111'
      CONTACT_EMAIL: info@thehenley.com.au
    volumes:
      - /mnt/persistent/stor/henley-website-prod:/data
    networks:
      - henley-website-prod-net
    expose:
      - '8000'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

networks:
  henley-website-prod-net:
    external: true
