# Security headers, included into every location that sets a header of its own.
#
# This file exists because of an nginx rule that is easy to be caught by:
# `add_header` directives are inherited from the enclosing block ONLY if the
# location defines none of its own. A location that sets nothing but a
# Cache-Control silently drops every security header set above it.
#
# The home page was doing exactly that — served through `location ~* \.html$`,
# which sets Cache-Control, and therefore shipping with no Content-Security-
# Policy at all while every other page had one. So each location that adds a
# header includes this, rather than relying on inheritance.
#
# The policy names what the *WordPress-era* pages actually load, which is more
# than the Astro site: Google Fonts (Lato), Adobe Typekit (Quincy CF), the
# Font Awesome Pro kit and its CDN, Elementor's inline scripts and styles,
# WP Rocket's lazy-load placeholders as data: images, and the same Google
# tag, analytics and Ads hosts as before. Verified against every page with
# replica/console-check.mjs; a host missing here fails silently in the
# browser, so that check is the gate, not this comment.
#
# ka-f.fontawesome.com only serves the static kit.js; the Pro kit's stylesheet,
# its @font-face CSS and the webfont files it references all come from
# ka-p.fontawesome.com, fetched at runtime, so that host needs both connect-src
# (for the CSS fetches) and font-src (for the .woff2/.ttf files themselves).
# kit.fontawesome.com (kit-upload.css) is a third, connect-src-only host the
# kit fetches. Google Ads' conversion linker posts to
# https://www.google.com/ccm/collect and https://ad.doubleclick.net/ccm/s/collect
# alongside the existing stats.g.doubleclick.net beacon, so connect-src needs
# both of those too.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.google.com.au https://googleads.g.doubleclick.net https://ka-f.fontawesome.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://kit.fontawesome.com https://ka-f.fontawesome.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://use.typekit.net https://p.typekit.net https://ka-f.fontawesome.com; font-src 'self' data: https://fonts.gstatic.com https://use.typekit.net https://p.typekit.net https://ka-f.fontawesome.com https://ka-p.fontawesome.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://ka-f.fontawesome.com https://ka-p.fontawesome.com https://kit.fontawesome.com https://p.typekit.net https://www.google.com https://ad.doubleclick.net; frame-src https://www.googletagmanager.com https://td.doubleclick.net" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# noindex on nonprod, nothing on prod. Chosen at image build (Dockerfile.replica).
include /etc/nginx/conf.d/robots-tag.conf;
