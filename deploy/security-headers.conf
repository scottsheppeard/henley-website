# Security headers, included into every location that sets a header of its own.
#
# This file exists because of an nginx rule that is easy to be caught by:
# `add_header` directives are inherited from the enclosing block ONLY if the
# location defines none of its own. A location that sets nothing but a
# Cache-Control silently drops every security header set above it.
#
# The home page was doing exactly that — served through `location ~* \.html$`,
# which sets Cache-Control, and therefore shipping with no Content-Security-
# Policy at all while every other page had one. So each location that adds a
# header includes this, rather than relying on inheritance.
#
# The policy names what the site actually loads and nothing aspirational:
# Google Tag Manager, GA4, and the Google Ads hosts behind the two click
# conversions on tel: and mailto: links. Omitting those would stop the only
# conversion measurement the business currently has, and it would fail silently.
# Fonts are self-hosted, so no font CDN appears.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.google.com.au https://googleads.g.doubleclick.net; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://www.googletagmanager.com https://td.doubleclick.net" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
