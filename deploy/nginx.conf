#
# thehenley.com.au — the whole server.
#
# It serves files and returns redirects. There is no application behind it, no
# PHP, no database and no admin surface, which is most of the point: of the last
# 20,000 requests the WordPress site logged, about 8,000 were POSTs to
# /xmlrpc.php and /wp-login.php. Those now cost a 410 from a static server
# instead of a PHP process and a database round trip.
#
# TLS, HSTS and the apex/www canonicalisation are Nginx Proxy Manager's job
# upstream. This is the origin behind it.

worker_processes auto;
error_log /dev/stderr warn;
pid /var/cache/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The proxy already logs; this is the origin's own record, without the
    # visitor's address, which it has no reason to keep.
    log_format origin '$request_method $request_uri $status $body_bytes_sent "$http_referer"';
    access_log /dev/stdout origin;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;
    # AVIF, WOFF2 and PNG are already compressed; gzipping them spends CPU to
    # make them very slightly larger.

    # Writable paths for a container that runs as a non-root user. Under
    # /var/cache/nginx, which the base image already gives to the nginx user —
    # not /tmp, whose ownership is not ours to change.
    client_body_temp_path /var/cache/nginx/client_body;
    proxy_temp_path /var/cache/nginx/proxy;
    fastcgi_temp_path /var/cache/nginx/fastcgi;
    uwsgi_temp_path /var/cache/nginx/uwsgi;
    scgi_temp_path /var/cache/nginx/scgi;

    # The /?p=<id> shortlink map. Generated; see deploy/redirects-map.conf.
    include /etc/nginx/conf.d/redirects-map.conf;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Relative Location headers. `return 301 /somewhere/;` otherwise makes
        # nginx build an absolute URL out of what it can see, which behind a
        # TLS-terminating proxy is its own scheme and its own port:
        # http://dev.thehenley.com.au:8080/luxury-retirement-living/. That is a
        # 301 with a correct-looking status, a correct-looking path, and a
        # destination nobody on the internet can reach — every WordPress
        # shortlink, and the Yoast sitemaps, landed there. The browser resolves
        # a relative Location against the origin it actually used.
        absolute_redirect off;

        # ── Security headers ──────────────────────────────────────────────────
        #
        # Also included into every location below that sets a header of its own:
        # nginx inherits add_header only into locations that define none, so a
        # location setting just a Cache-Control silently drops all of these.
        include /etc/nginx/conf.d/security-headers.conf;

        # ── Redirects ─────────────────────────────────────────────────────────
        include /etc/nginx/conf.d/redirects.conf;

        # ── Bot traffic ───────────────────────────────────────────────────────
        #
        # 410, not 404. These paths existed and are gone for good, and a well-
        # behaved crawler drops a 410 from its index rather than retrying it.
        # The scanners will not care, but they cost nothing now either way.
        location = /xmlrpc.php { return 410; }
        location = /wp-login.php { return 410; }
        location ~* ^/(wp-admin|wp-includes|wp-json|wp-cron\.php|wp-config) { return 410; }
        location ~* \.(php|phtml|asp|aspx|jsp|cgi)$ { return 410; }

        # ── Documents ─────────────────────────────────────────────────────────
        #
        # The dated PDFs are indexed, linked from email signatures and printed
        # in brochures, so they keep their WordPress paths for good and are
        # immutable at those paths.
        location ^~ /wp-content/uploads/ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # The stable aliases always point at the current revision, so they must
        # revalidate. Long-caching these is how a visitor keeps seeing last
        # year's fees after the file behind the alias has been replaced.
        location ^~ /documents/ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # ── Static assets ─────────────────────────────────────────────────────
        #
        # Everything under /_astro/ is content-hashed, so it can be cached
        # forever: a change produces a new filename rather than a stale file.
        location ^~ /_astro/ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # HTML must revalidate, or a content fix takes a week to reach anyone.
        location ~* \.html$ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        location = /robots.txt {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=3600";
        }

        location ~* ^/sitemap.*\.xml$ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=3600";
        }

        # ── Pages ─────────────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "no-store";
        }

        # The container's own liveness check. Not proxied publicly.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
