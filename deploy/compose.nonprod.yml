# henley-website — nonprod (dev.thehenley.com.au)
#
#   cd /mnt/persistent/dev/henley-website
#   docker compose --env-file deploy/.env -f deploy/compose.nonprod.yml up -d --build
#
# --env-file is not optional. Compose reads `.env` from the directory it runs
# in, not from deploy/, so without it TRUSTED_PROXY_IPS arrives empty and the
# receiver believes no proxy at all — see deploy/.env.example.
#
# The site image needs no build step: replica/site is committed. Refresh it
# with `forms/.venv/bin/python replica/export.py` and commit before deploying
# (replica/README.md).
#
# The network is created once, by hand, and attached to Nginx Proxy Manager:
#
#   docker network create henley-website-nonprod-net
#   # add it to /home/admin/henley-aws/docker-compose.yml under the
#   # npm-attachment service and the networks: block, then recreate NPM
#
# Then in NPM, point host 4 (dev.thehenley.com.au) at henley-website-nonprod:8080
# and add a second location, /api/enquiry -> henley-website-forms-nonprod:8000.

name: henley-website-nonprod

services:
  site:
    container_name: henley-website-nonprod
    build:
      context: ..
      dockerfile: deploy/Dockerfile.replica
      args:
        SITE_ENV: nonprod
    image: henley-website:nonprod
    restart: unless-stopped
    networks:
      - henley-website-nonprod-net
    # No published port: NPM reaches it over the shared network. Nothing on
    # this host should be able to reach it directly.
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/nginx-health']
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  forms:
    container_name: henley-website-forms-nonprod
    build:
      context: ../forms
      dockerfile: Dockerfile
    image: henley-website-forms:nonprod
    restart: unless-stopped
    # The host's `admin` user, so the SQLite file and its -wal/-shm sidecars are
    # readable by the henley-utils job that runs as that user.
    user: '1000:1000'
    environment:
      INTAKE_DB_PATH: /data/intake.sqlite
      # X-Forwarded-For is believed only from peers on this site's network — in
      # practice NPM — and only by the receiver: uvicorn runs with
      # --no-proxy-headers so nothing else gets a vote. Anyone can send the
      # header, and trusting it generally would make every rate limit bypassable
      # by inventing an address per request.
      #
      # This is the SUBNET of henley-website-nonprod-net, not any one address on
      # it. The receiver publishes no port and NPM is the only multi-homed
      # container on this network, so nothing reaches the receiver except from
      # inside it or from the host, through its gateway: the network is the
      # boundary. Keep it so: no `ports:` for this service and nothing else on
      # this network. A published port's connections can arrive from the
      # gateway, inside this subnet, and would be believed (docs/decisions.md,
      # 2026-10-06). Read the subnet once the network exists:
      #   docker network inspect henley-website-nonprod-net -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      # It survives host reboots and NPM recreations and changes only if the
      # network itself is deleted and recreated. NPM's address does not: the
      # 2026-09-27 reboot moved it, and the receiver went on trusting the old
      # one (docs/decisions.md, 2026-10-06).
      #
      # Empty is not a default, it is a misconfiguration: every visitor is then
      # attributed to the proxy and three-an-hour becomes a site-wide limit.
      # The receiver logs a warning at startup when this is unset, and refuses
      # to start on an entry it cannot parse. The check prints the startup
      # line, the warning or the refusal, whichever came last:
      #   docker logs henley-website-forms-nonprod 2>&1 | grep -E 'believed|TRUSTED_PROXY_IPS' | tail -1
      # Verified with scripts/check-proxy-trust.sh.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      CONTACT_PHONE: '07 5591 2111'
      CONTACT_EMAIL: info@thehenley.com.au
    volumes:
      - /mnt/persistent/stor/henley-website-nonprod:/data
    networks:
      - henley-website-nonprod-net
    expose:
      - '8000'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

networks:
  henley-website-nonprod-net:
    external: true
